idea:
  title: Is Linear/Nonlinear Information in LLMs Similar to Conscious/Unconscious
    Information in Humans?
  domain: artificial_intelligence
  hypothesis: 'There is an analogy between linear/nonlinear information in large language
    models (LLMs) and conscious/unconscious information in humans. Specifically, LLMs
    may be able to introspect or be "aware" of linear information but not nonlinear
    information, similar to how humans may be conscious of some information and unconscious
    of other information. The extent to which LLMs can introspect on nonlinear information,
    such as refusal behaviors, remains unclear.

    '
  background:
    description: 'The representation hypothesis suggests that information in LLMs
      is largely linear, but some behaviors (such as refusal) may be nonlinear. In
      humans, unconscious information clearly exists, though it is not well defined.
      There is a tantalizing possibility that LLMs are not fully aware of their own
      nonlinear behaviors, even if they are aware of linear attributes like political
      stance. The concepts of awareness and introspection in LLMs are still partially
      undefined.

      '
    papers:
    - url: https://arxiv.org/html/2501.08145v1
      description: This paper argues that behaviors such as refusal in LLMs are nonlinear.
